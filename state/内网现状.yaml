    containers: ["vllm-pd-clickhouse-test-glm53", "vllm-pd-vector-test-glm53", "vllm-pd-prometheus-test-glm53"]
    volumes: ["vllm-pd-clickhouse-test-glm53-data", "vllm-pd-clickhouse-test-glm53-logs", "vllm-pd-vector-test-glm53-data", "vllm-pd-prometheus-data-test-glm53"]
    dirs:
