  - name: "包二 v3 更新脚本"
    file: "vllm_pd_update_pack2_filled.py"
    location: "<用户目录>/vllm-pd-update-v3/"
    note: "「现场路径」一段的 USER_DIR、ROOT 是各手册已填路径版的来源；与占位符版只差 USER_DIR 一行"
