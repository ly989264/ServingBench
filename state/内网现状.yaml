    basis: "system_manual 第 5.4、8.3 节"
  - name: "包二 v3.1-extra 更新脚本与《操作说明 B》"
    status: "未用（对象 test 已删除、没有升级）；是否拷到监控机未核实"
    basis: "T51 任务记录"

clusters:
  - name: "glm53-1"
    display_name: "glm53-1"
    panels: ["panel1", "panel2"]
    purpose: "glm5.3 服务集群；面板一显示真实服务指标，面板二在真实 vLLM 接入前用 mock 跑通链路"
    model_group: "glm53-1"
    grafana_folder: "GLM-5.3/glm53-1"
    package:
      panel1: {sha256_8: "60ce7f30", built: "2026-11-12T15:06:34Z"}
      panel2: {version: "v3", sha256_8: "3e98c2b4", built: "2026-11-16T11:57:20Z", config_id: "pd-diag-v3-2026-11-16", segments_profile: ""}
    mode: "mock"
    mock_rate: "说明书记为 64，未经内网核对"
    port_base: 18100
    ports: {clickhouse: 18100, puller: 18101, prometheus: 18102}
    containers: ["vllm-pd-prometheus-glm53-1", "vllm-pd-clickhouse-glm53-1", "vllm-pd-vector-glm53-1"]
    dirs:
      panel1: "<ROOT>/vllm-pd-grafana-panel1/glm53-1"
      panel1_inventory: "<ROOT>/vllm-pd-grafana-panel1/glm53-1/prometheus/inventory.json"
      panel2: "<ROOT>/vllm-pd-grafana-panel2/glm53-1"
      timing_home: "<ROOT>/vllm-timing/glm53-1"
      clickhouse_data_dir: "<glm53-1 的数据目录>（已设，路径未核实）"
      node_conf_dir: "节点上 <SSH账号> 家目录下的 vllm-pd-diag/conf（默认值，内网是否改过未核实）"
      node_log_dir: "节点上 <SSH账号> 家目录下的 vllm-pd-diag/logs（同上）"
    deploy_env_keys: {NODE_MODE: "mock", EVENT_TTL_DAYS: "15", SUMMARY_TTL_DAYS: "30", PULL_RSYNC_FLAGS: "--append", SEGMENTS_PROFILE: ""}
    nodes:
      machines: 12
      prefill: {machines: 8, instances_per_machine: 1, instances: "P0-P7", tp: 16}
      decode: {machines: 4, instances_per_machine: 16, instances: "D0-D63", tp: 1}
      addresses: ["<P节点1>", "…", "<P节点8>", "<D节点1>", "…", "<D节点4>"]
    grafana:
      boards: ["vllm-pd-prefill-glm53-1", "vllm-pd-decode-glm53-1", "vllm-pd-request-glm53-1"]
      datasources: ["prometheus-glm53-1", "vllm-pd-clickhouse-glm53-1"]
    coupling:
      - "面板二用面板一的 Prometheus 做采集链路告警（注册表 PROMETHEUS_YML 指向面板一目录的 prometheus.yml）"
      - "它的面板二 deploy.env 是 test-glm53 的 --env-from、7 套新面板一集群 add 的 --env-from、arrange_boards.py 的 --env-from"
      - "它的面板一清单是 make_inventories.py 的 --defaults（exporter 端口、抓取间隔、超时、保留期）"
    basis: "system_manual 第 6 节；T45 镜像同步记录"

