# 内网现状（面板一、面板二）：docs/02-内网现状.md 的机器可读版。
# 2026-11-28 只更新了本文件；docs/02-内网现状.md 仍是 2026-11-22 的状态，两者不一致时以本文件为准。
#
# 地址都是占位符：<监控机>、<P节点1>、<D节点1>、<proxy机器> 等；需要示例地址时只用示例集 10.1.x.x。
# 实验室地址（10.98.x.x）只出现在 lab_mirror 一节，并注明是实验室地址。
# 目录占位符：<ROOT> = 面板目录的上级目录（VLLM_PD_ROOT，手册中写作 <总目录>）；
#             <用户目录> = 监控机上放部署包和更新脚本的个人目录（更新脚本的 USER_DIR）；
#             ~ = 监控机上执行账号的家目录。现场值只放在 local/，不进 git。
#
# 状态时点：2026-11-28。
#   面板一：线上 8 个集群（glm53-0、glm53-1、glm53-2、dsv41-flash-1…5）的 16 张看板升级到 v1.2。
#   面板二：线上 glm53-1 为 T53 完成的版本（v3.4-extra-t53，看板带整天快捷时间范围，与 pkg26 相同），接真实 vLLM；
#           线下测试集群 test-glm53 换成 T62 采集进程方案（v4.0-extra），已部署、待验收（第 6 步核对有 1 项不符，原因在查）。
#
# 字段含义：
#   as_of            状态时点
#   basis            每条值的依据，取值见 basis_values
#   monitor          监控机：架构、执行账号、注册表、共用的 Grafana、docker 网络
#   packages         监控机上在用和停用的部署包、更新脚本：sha256_8 为 sha256 前 8 位，built 为包内 MANIFEST 的构建时间
#   clusters         每个已登记的集群一条：
#     name             内部名（容器、目录、注册表、看板 UID 用它）
#     display_name     Grafana 文件夹和看板标题里显示的名字
#     panels           装了哪些面板：panel1（服务侧指标，Prometheus）、panel2（请求时延 L1/L2/L3，ClickHouse）
#     purpose          用途
#     model_group      MODEL_GROUP，等于 Grafana 子文件夹名
#     grafana_folder   看板所在的「上一层 / 子文件夹」
#     package          用的包及 sha256 前 8 位；config_id 为面板二 segments.json 的 config_id
#     mode             面板二的 NODE_MODE：mock 或 vllm；只有面板一时为 null
#     port_base        端口基数 B；ports 为它占用的主机端口（ClickHouse = B，拉取程序 = B+1，Prometheus = B+2）
#     dirs             监控机上的目录
#     nodes            节点数与实例布局
#     coupling         与其他集群的耦合
#     basis            这一条的依据
#   grafana_folders  Grafana 文件夹树及每个文件夹里的看板（title + uid）
#   topology         真实拓扑（两种集群形态和 glm5.3 测试集群）
#   removed_or_retired  已删除或停用的东西
#   lab_mirror       实验室镜像与内网的已知不同
#   pending_changes  已交付或进行中、还没有做完的变更
#   unverified       未核实的事项

schema_version: 1
as_of: "2026-11-28"
state_basis: "用户 2026-11-28 报：面板一线上升级 v1.2 完成；面板二线上 T53 完成、线下测试集群按 T62 部署（第 6 步核对 1 项不符）。各升级的逐步带回输出没有全部见到，没有见到的按手册与包内容写，并在 basis 中注明"

basis_values:
  intranet_output: "内网带回的输出（注明任务与日期）"
  user_report: "用户报告做完（注明日期），逐步输出未见"
  manual: "交付给内网的手册"
  package: "按交付的包内容推得，没有带回输出直接证明"
  system_manual: "《面板系统说明书》v3.1-extra 第二部分（2026-11-14 的状态）"
  manual_and_mirror: "按手册与镜像推得，未经内网核对"
  unverified: "未核实"

placeholders:
  "<监控机>": "监控机地址"
  "<P节点1>": "某集群 P 侧第 1 台机器的地址，依此类推"
  "<D节点1>": "某集群 D 侧第 1 台机器的地址，依此类推"
  "<proxy机器>": "某集群 proxy 所在的机器"
  "<ROOT>": "面板目录的上级目录（包二 v3 已填路径更新脚本的 ROOT）"
  "<用户目录>": "监控机上放部署包和更新脚本的个人目录（同一脚本的 USER_DIR）"
  "<SSH账号>": "从监控机登录节点的账号（deploy.env 的 SSH_USER）"

monitor:
  address: "<监控机>"
  arch: "aarch64"
  exec_account: "装面板、执行更新脚本的账号；注册表、备份、诊断报告在它的家目录"
  registry:
    path: "~/.vllm-pd-clusters.json"
    format: "vllm-pd-clusters version 1"
    root: "<ROOT>"
    holds_credentials: false
  docker_network: "obs-net"
  grafana:
    version: "12.4.2"
    plugins: ["grafana-clickhouse-datasource 4.23.4"]
    port: "说明书记为 3000，未经内网核对（实验室镜像为 3300）"
    container: "deploy.env 的 GRAFANA_CONTAINER，未核实"
    shared_by_all_clusters: true
  prometheus:
    version: "v3.11.2"
    retention: "15d"
    alertmanager: false
  clickhouse_image: "clickhouse/clickhouse-server:26.8.36.3（说明书的值；T53、T62 之后的镜像没有带回）"
  vector_image: "timberio/vector:0.61.0-debian（glm53-1 面板二仍用；test-glm53 在 T62 第 1 步停用 Vector）"
  credentials_location: "各集群 deploy.env（权限 600）、采集器配置、容器启动参数；--env-from 只取 6 个共用值"
  shared_keys_from_env: ["GRAFANA_URL", "GRAFANA_USER", "Grafana 凭据", "GRAFANA_CONTAINER", "DOCKER_NETWORK", "MONITOR_HOST"]
  ssh_to_nodes: "T53、T62 的脚本由监控机以 root 免密登录各台 P、D 机器（及 proxy 机器）执行"
  basis: "system_manual；T45 镜像同步记录（2026-11-18）；T53 三个脚本与 T62 升级手册的前提"

