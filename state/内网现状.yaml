      pack: "<用户目录>/vllm-pd-panel2-v3.1-extra/pack/vllm-pd-grafana-panel2"
      account_workdir: "~/vllm-pd-test-glm53/"
      node_conf_dir: "/data/pd-diag/conf（容器里同路径）"
      node_log_dir: "/data/pd-diag/logs（容器里同路径）"
    deploy_env_keys:
      NODE_MODE: "vllm"
      MODEL_GROUP: "test-glm53"
      SEGMENTS_PROFILE: "glm53"
      PROMETHEUS_YML: "<ROOT>/vllm-pd-prometheus-test-glm53/prometheus.yml"
      SSH_USER: "<SSH账号>（沿用 test）"
      NODE_CONF_DIR: "/data/pd-diag/conf"
      NODE_LOG_DIR: "/data/pd-diag/logs"
      NODE_CONF_DIR_IN_CONTAINER: "/data/pd-diag/conf"
      NODE_LOG_DIR_IN_CONTAINER: "/data/pd-diag/logs"
      NODE_CONTAINER_UID: ""
      PULL_MIN_DISK_GB: "16"
      CLICKHOUSE_MIN_DISK_GB: "85"
      NODE_MIN_DISK_GB: "50"
      CLICKHOUSE_DATA_DIR: ""
      PROXY_COLLECT: "1（面板手册第 17 步；是否已写入未核实）"
      PROXY_MACHINE: "<proxy机器>"
      PROXY_LOG_DIR: "<proxy日志目录>"
      MOONCAKE_LOG_COLLECT: "1（同上）"
      MOONCAKE_LOG_FILES: "<P节点1>=<P 实例日志文件>"
      MOONCAKE_TID_FALLBACK: "0"
    nodes:
      machines: 2
      prefill: {machines: 1, instances_per_machine: 1, instances: "P0", port: 9900, tp: "未核实"}
      decode: {machines: 1, instances_per_machine: 16, instances: "D0-D15", ports: "9100-9115", tp: 1, dp: 16}
      addresses: ["<P节点1>", "<D节点1>"]
      nodes_basis: "intranet_output（T51 面板手册第 13 步、打补丁手册第 3 步检测，2026-11-19）"
    vllm:
      versions: "vLLM v0.30.0；vllm-ascend d4ad49796（现场有本地改动）；MooncakeConnectorV1 + AscendStoreConnector"
      logcfg_before_patch: "D 机器 unset；P 机器检测时没有找到运行中的 vLLM，未得到"
      patches: "vLLM、vllm-ascend、p2d 三件按打补丁手册分三批装入；可选的 Mooncake 替换库是否已换未核实；proxy 补丁不在打补丁手册内，是否已打未核实"
    expected_segments: "47 段里 42 段有值；做了 Mooncake 部分后 45 段"
    grafana:
      boards: ["vllm-pd-request-test-glm53"]
      datasources: ["vllm-pd-clickhouse-test-glm53"]
    coupling:
      - "没有面板一；自己的只告警 Prometheus 手工起，网络与镜像取自 vllm-pd-prometheus-glm53-1，不归 panel2_cluster.sh remove 管，不是 Grafana 数据源"
