topology:
  glm53:
    prefill: "8 台，每台 1 个实例（DP8，TP16，8 个 P 实例一个 DP 组，data-parallel 地址指向 P0，每个实例一个 API server）"
    decode: "4 台，每台 16 个实例，共 64 个（TP1，每个实例一个 API server）"
    instances: "P0-P7、D0-D63"
    used_by: ["glm53-1"]
    basis: "用户提供（T14，2026-11-05；2026-11-18 重申）；system_manual 第 6.1 节"
  dsv41:
    prefill: "4 台，每台 2 个实例，8 个 P 实例一个 DP 组"
    decode: "2 台，每台 8 个实例，共 16 个"
    instances: "P0-P7、D0-D15"
    used_by: ["dsv41-flash-1", "dsv41-flash-2", "dsv41-flash-3", "dsv41-flash-4", "dsv41-flash-5"]
    basis: "用户提供（2026-11-18）；T43 用户答复（2026-11-16）"
  glm53_test:
    prefill: "1 台 1 个实例（端口 9900）"
    decode: "1 台 16 个实例（端口 9100-9115，TP1）"
    instances: "P0、D0-D15"
    used_by: ["test-glm53"]
    basis: "intranet_output（T51，2026-11-19）"
  naming_rule: "实例名按清单里 API server 的顺序计算（第 n 项为 Pn / Dn，按 DP rank 排），不写死；整个 P/D 集群一个 proxy"

