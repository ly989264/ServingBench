      decode: {machines: 4, instances_per_machine: 16, instances: "D0-D63", tp: 1}
      addresses: ["<P节点1>", "…", "<P节点8>", "<D节点1>", "…", "<D节点4>"]
    vllm:
      versions: "vLLM 0.30.0；vllm-ascend d4ad49796；Mooncake 现场原库 0.3.13（打补丁前，2026-11-27 环境检测带回）"
