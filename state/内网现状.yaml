    model_group: "glm53-1"
    grafana_folder: "GLM-5.3/glm53-1"
    package:
      panel1: {version: "v1.2", sha256_8: "55847494", built: "2026-11-28T03:29:33Z", basis: "user_report（2026-11-28）"}
      panel2: {version: "v3.4-extra-t53", source: "T53 两步包 pkg25（9f286033）+ 单独改法 t53qrange.py；看板内容与 pkg26 相同", segments_profile: "glm53", basis: "user_report（2026-11-27 pkg25 四段完成；2026-11-28 T53 完成）；快捷时间范围改法的执行输出未见"}
    mode: "vllm"
    port_base: 18100
    ports: {clickhouse: "18100（未核实）", puller: "18101（未核实）", prometheus: 18102}
    port_basis: "面板一 Prometheus 18102 沿用；面板二 11-27 重装后分到的端口没有带回"
    containers: ["vllm-pd-prometheus-glm53-1", "vllm-pd-clickhouse-glm53-1（按命名规则）", "vllm-pd-vector-glm53-1（按命名规则）"]
    dirs:
      panel1: "<ROOT>/vllm-pd-grafana-panel1/glm53-1"
