# Grafana datasource provisioning for dashboard 1.
# The dashboard's "datasource" variable defaults to uid "prometheus"; keep the uid if you rename the datasource.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false
    jsonData:
      # Must equal the Prometheus scrape_interval (inventory "scrape_interval"); $__rate_interval is derived from it.
      timeInterval: ${PROMETHEUS_SCRAPE_INTERVAL}
      httpMethod: POST
      prometheusType: Prometheus
