# Load every dashboard JSON under /etc/grafana/dashboards (mounted from ./grafana/dashboards).
apiVersion: 1
providers:
  - name: vllm-pd
    folder: vLLM P/D
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
