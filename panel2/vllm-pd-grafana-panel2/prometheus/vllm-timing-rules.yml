groups:
  - name: vllm-timing
    rules:
      - alert: VllmTimingParseFailed
        expr: increase(vector_component_sent_events_total{component_id="parse",output="dropped"}[5m]) > 20
        labels: {severity: warning}
        annotations:
          summary: "采集器有日志行解析失败"
      - alert: VllmTimingBufferFilling
        expr: vector_buffer_size_bytes{component_id=~"ch_.*"} > 10e6
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "采集器写 ClickHouse 堵住了"
      - alert: VllmTimingCentralDown
        expr: up{job="vllm-timing-central"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "采集器访问不到"
      - alert: VllmTimingPullerDown
        expr: up{job="vllm-timing-puller"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "拉取程序没有运行"
      - alert: VllmTimingPullStale
        expr: time() - vllm_puller_last_success_seconds > 120
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.machine }} 超过 2 分钟没有拉取成功"
      - alert: VllmTimingNoLogLines
        expr: increase(vllm_puller_transferred_bytes_total[10m]) == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.machine }} 10 分钟没有新日志"
